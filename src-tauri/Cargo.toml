[package]
name = "ai-roundtable"
version = "0.1.0"
description = "ai-roundtable local AI weekly roundtable content workbench"
authors = ["ai-roundtable"]
edition = "2021"

[lib]
name = "ai_roundtable_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
ico = "0.3"
tauri-build = { version = "2.0", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hound = "3.5"
pdf-extract = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rss = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shine-rs = "0.1.3"
tauri = { version = "2.0", features = ["image-ico"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-opener = "2.0"
time = { version = "0.3", features = ["formatting", "macros"] }
zip = "0.6"
